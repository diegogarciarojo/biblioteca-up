services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      BIBLIOTECA_DATA_DIR: /data
    volumes:
      - library_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto': 'https'}), timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  library_data:
  caddy_data:
  caddy_config:
