<button class="theme-toggle{% if compact %} theme-toggle--compact{% endif %}" type="button" data-theme-toggle aria-label="Modo nocturno" aria-pressed="false" title="Activar modo nocturno" hidden>
  <span class="theme-toggle-icons" aria-hidden="true">
    <svg class="theme-moon" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M20.8 13.3A9 9 0 0 1 10.7 3.2a9 9 0 1 0 10.1 10.1Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg class="theme-sun" width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
  </span>
  <span class="theme-toggle-label" data-theme-label>Modo nocturno</span>
</button>
